<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1d3a">
  <title>你的小星球 · 设计人生蓝图</title>
  <meta name="description" content="在一颗小星球上走一圈，用泉水、火山、日落和玫瑰照见你的健康、工作、娱乐与爱。设计人生蓝图的 3D 第一站。">
  <style>
    :root {
      --ink: #231d2b;
      --muted: rgba(35, 29, 43, 0.62);
      --paper: rgba(255, 251, 244, 0.94);
      --paper-solid: #fffbf4;
      --line: rgba(35, 29, 43, 0.12);
      --accent: #e8743b;
      --accent-dark: #c4561f;
      --rose: #e0475a;
      --teal: #1f9c8c;
      --gold: #f2b84b;
      --night: #1d1530;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--night);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    button { font: inherit; color: inherit; }

    .hud-top {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
      z-index: 5;
    }

    .quest-card, .hud-actions button, .chip-btn {
      pointer-events: auto;
    }

    .quest-card {
      background: var(--paper);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(20, 10, 40, 0.25);
      max-width: 240px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .quest-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: none;
      border: 0;
      padding: 0;
      width: 100%;
      cursor: pointer;
      text-align: left;
    }

    .quest-title { font-size: 14px; font-weight: 700; }
    .quest-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .quest-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      display: grid;
      gap: 2px;
    }

    .quest-card.is-collapsed .quest-list { display: none; }

    .quest-list button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: none;
      padding: 6px 4px;
      min-height: 36px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }

    .quest-list button:hover { background: rgba(232, 116, 59, 0.08); }

    .quest-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 11px;
      flex: none;
    }

    .is-done .quest-dot { background: var(--teal); border-color: var(--teal); color: #fff; }
    .quest-sub { color: var(--muted); font-size: 12px; margin-left: auto; }

    .hud-actions { display: flex; gap: 8px; }

    .icon-btn {
      border: 0;
      background: var(--paper);
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(20, 10, 40, 0.25);
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      pointer-events: auto;
    }

    .labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

    .obj-label {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 251, 244, 0.88);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(20, 10, 40, 0.2);
      transition: opacity 0.2s;
    }

    .obj-label.is-done::after { content: " ✓"; color: var(--teal); }
    .obj-label.is-far { background: rgba(30, 20, 50, 0.55); color: #f4e9ff; font-weight: 500; }

    .interact-btn {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 28px);
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      min-height: 50px;
      padding: 0 26px;
      box-shadow: 0 10px 30px rgba(232, 116, 59, 0.45);
      cursor: pointer;
      z-index: 6;
    }

    .interact-btn[hidden] { display: none; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 92px);
      transform: translateX(-50%);
      background: rgba(30, 20, 50, 0.6);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.6s;
    }

    .joystick {
      position: fixed;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 4;
      display: none;
    }

    .joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
    }

    .sheet-backdrop.is-open { display: block; }

    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: min(560px, 100%);
      transform: translate(-50%, 105%);
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
      background: var(--paper-solid);
      border-radius: 22px 22px 0 0;
      padding: 18px 20px calc(var(--safe-bottom) + 18px);
      box-shadow: 0 -12px 40px rgba(20, 10, 40, 0.3);
      z-index: 9;
      max-height: 78vh;
      overflow-y: auto;
    }

    .sheet.is-open { transform: translate(-50%, 0); }

    .sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: -6px auto 12px; }
    .sheet-kicker { font-size: 12px; font-weight: 700; color: var(--accent-dark); letter-spacing: 0.04em; }
    .sheet-title { font-size: 19px; line-height: 1.4; margin: 6px 0 8px; }
    .sheet-story { font-size: 14px; line-height: 1.75; color: var(--muted); margin: 0 0 14px; }
    .sheet-question { font-size: 15px; font-weight: 600; line-height: 1.6; margin: 0 0 12px; }

    .score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }

    .score-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 36px;
    }

    .score-num {
      min-width: 54px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .score-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    .sheet textarea {
      width: 100%;
      min-height: 110px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      background: #fff;
      color: var(--ink);
    }

    .sheet textarea:focus { outline: 2px solid rgba(232, 116, 59, 0.4); border-color: var(--accent); }

    .sheet-warn { color: var(--rose); font-size: 13px; margin: 8px 0 0; min-height: 1em; }

    .sheet-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

    .btn {
      border: 0;
      border-radius: 12px;
      min-height: 46px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-ghost { background: rgba(35, 29, 43, 0.06); color: var(--ink); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .reaction {
      background: #fff3e6;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 4px;
    }

    .radar { display: grid; gap: 8px; margin: 12px 0 4px; }
    .radar-row { display: grid; grid-template-columns: 64px 1fr 42px; align-items: center; gap: 8px; font-size: 13px; }
    .radar-bar { height: 8px; border-radius: 8px; background: rgba(35, 29, 43, 0.08); overflow: hidden; }
    .radar-bar span { display: block; height: 100%; border-radius: 8px; }

    .coach {
      margin-top: 12px;
      border: 1.5px dashed rgba(31, 156, 140, 0.5);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.7;
    }

    .coach-label { font-size: 12px; font-weight: 700; color: var(--teal); }
    .coach p { margin: 6px 0 0; }

    .postcard-wrap { text-align: center; }
    .postcard-wrap img { width: 100%; border-radius: 14px; box-shadow: 0 10px 30px rgba(20, 10, 40, 0.25); }

    .next-planets { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
    .next-planets li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: rgba(35, 29, 43, 0.04); }
    .next-planets span:last-child { color: var(--muted); }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 20px calc(var(--safe-bottom) + 40px);
      text-align: center;
      color: #fff;
      background: linear-gradient(180deg, rgba(29, 21, 48, 0) 40%, rgba(29, 21, 48, 0.75) 100%);
      transition: opacity 0.6s;
    }

    .intro.is-hidden { opacity: 0; pointer-events: none; }
    .intro h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: 0.06em; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
    .intro p { margin: 0 0 22px; line-height: 1.8; font-size: 14px; max-width: 360px; opacity: 0.92; }
    .intro .btn-primary { flex: none; min-width: 180px; min-height: 52px; font-size: 16px; border-radius: 999px; }
    .intro small { margin-top: 14px; font-size: 12px; opacity: 0.7; line-height: 1.6; max-width: 360px; }

    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f4e9ff;
      font-size: 14px;
      z-index: 11;
      background: var(--night);
      transition: opacity 0.5s;
    }

    .loading.is-hidden { opacity: 0; pointer-events: none; }

    .toast {
      position: fixed;
      left: 50%;
      top: calc(var(--safe-top) + 70px);
      transform: translate(-50%, -10px);
      background: rgba(30, 20, 50, 0.85);
      color: #fff;
      font-size: 13px;
      line-height: 1.6;
      padding: 10px 16px;
      border-radius: 12px;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 520px) {
      .quest-card { max-width: 200px; padding: 8px 10px; }
      .hud-actions .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="你的小星球 3D 场景"></canvas>
  <div class="labels" id="labels"></div>

  <div class="hud-top">
    <div class="quest-card" id="questCard">
      <button class="quest-head" id="questHead" type="button" aria-expanded="true">
        <span class="quest-title">星球巡礼</span>
        <span class="quest-count" id="questCount">0 / 6</span>
      </button>
      <ul class="quest-list" id="questList"></ul>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="overviewBtn" type="button">俯瞰</button>
      <a class="icon-btn hide-sm" href="./index.html">完整问卷</a>
    </div>
  </div>

  <div class="hint" id="hint" style="opacity:0">拖动左侧移动 · 拖动右侧转视角 · 点物件走过去</div>
  <button class="interact-btn" id="interactBtn" type="button" hidden>查看</button>
  <div class="joystick" id="joystick"><div class="joystick-knob" id="joystickKnob"></div></div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="intro" id="intro">
    <h1>你的小星球</h1>
    <p>每个人都住在一颗小星球上。泉水、火山、日落和玫瑰，<br>分别是你的健康、工作、娱乐和爱。<br>走一圈，看看你的星球现在是什么样子。</p>
    <button class="btn btn-primary" id="startBtn" type="button">降落</button>
    <small>设计人生蓝图 · 3D 第一站。回答保存在本机浏览器，会和完整问卷共用进度。</small>
  </div>

  <div class="loading" id="loading">正在靠近你的星球…</div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="./b612/main.js"></script>
</body>
</html>
